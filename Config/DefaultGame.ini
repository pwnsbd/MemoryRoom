bStartInVR=True

[/Script/UnrealEd.ProjectPackagingSettings]
; Only ship the MemoryRoom map. With this empty the cooker pulls in every .umap in the
; project - the Pack_Bonus demo map, the log-cabin sample levels, the VR template map -
; and every 4K/8K texture they reference. This is the single biggest APK-size lever.
+MapsToCook=(FilePath="/Game/MemoryRoom")

; Belt-and-suspenders. With MapsToCook set, only referenced assets cook anyway, so this just
; guarantees the ~450 MB Pack_Bonus demo content and the cabin sample levels never sneak in.
; NOTE: do NOT exclude StylizedlogCabin_A1/Cabin - the rock "mountain" meshes pull
; MI_Rock_A1 (and its textures) from there. The unused cabin prop art still won't cook
; because nothing in the MemoryRoom map references it.
+DirectoriesToNeverCook=(Path="/Game/Pack_Bonus")
+DirectoriesToNeverCook=(Path="/Game/StylizedlogCabin_A1/Levels")

