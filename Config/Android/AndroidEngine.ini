[/Script/Engine.RendererSettings]
r.DistanceFields=0

; Desktop-renderer features carried over from the VR template. The Quest mobile forward
; renderer ignores all of these at runtime, but leaving them on still makes the cook build
; ray-tracing PSOs, Lumen scene data, virtual-shadow-map paths and mesh distance fields
; into the APK. Force them off for the Android build only - the editor / Link preview is
; untouched. (r.Substrate is deliberately NOT flipped here: it changes the material
; pipeline and should be decided project-wide, not per-platform.)
r.RayTracing=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False

; --- Quest frame-rate headroom ---
; 2x MSAA instead of 4x - halves the MSAA resolve cost, still clean enough for VR.
r.MobileMSAA=2
; Render alpha-masked materials (pine leaves!) in the early depth pass so the dense forest
; stops paying for massive overdraw on the tile GPU. This is usually the single biggest win
; for a scene full of foliage cards.
r.Mobile.EarlyZPass=1
r.Mobile.EarlyZPassOnlyMaterialMasking=1
; Let foliage cross-fade between LODs instead of popping, so we can cull aggressively later.
foliage.DitheredLOD=1

; --- Sun shadow (one tight cascade around the player) ---
r.Shadow.CSM.MaxMobileCascades=1
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.DistanceScale=1.0
; Masked materials (pine leaves) should not spend time in the shadow pass - the trees are
; set non-casting anyway, this just guarantees it.
r.Shadow.CSMCaching=1

; r.Mobile.AllowFramebufferFetch=1 reverts the mobile deferred renderer from multi-pass to single-pass/Vulkan subpasses, which was the default before UE 5.7.
; Multi-pass deferred is disabled for VR Template for 5.7.1 due to rendering issues with mobile multi-view.
r.Mobile.AllowFramebufferFetch=1